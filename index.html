<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>오사카 · 교토 여행 일정 (2026.12.1 – 12.4)</title>

<style>
body{
  margin:0;
  background:#f3ede6;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

main{
  max-width:1030px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:16px 0;
}

.day{
  position:relative;
  line-height:0;
}

.day img{
  width:100%;
  height:auto;
  display:block;
}

.map{
  position:absolute;
  display:block;
  border-radius:8px;
  outline:2px solid transparent;
  transition:outline-color .15s,background .15s;
}

.map:hover,
.map:focus-visible{
  outline-color:#b3262c;
  background:rgba(179,38,44,.08);
}

.map span{
  position:absolute;
  right:8px;
  bottom:8px;
  line-height:1.2;
  font-size:13px;
  font-weight:600;
  color:#fff;
  background:#b3262c;
  padding:6px 10px;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
</style>
</head>

<main>
